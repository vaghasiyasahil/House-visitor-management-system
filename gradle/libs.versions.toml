[versions]
agp = "8.6.1"
androidMail = "1.6.7"
googleAuthLibraryOauth2Http = "1.23.0"
kotlin = "2.0.0"
coreKtx = "1.12.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.12.0"
activity = "1.9.0"
constraintlayout = "2.2.1"
navigationFragmentKtx = "2.8.5"
navigationUiKtx = "2.8.5"
gridlayout = "1.0.0"
firebaseFirestoreKtx = "25.1.1"
googleGmsGoogleServices = "4.4.4"
firebaseFirestore = "25.1.1"
firebaseDatabase = "22.0.1"
camerax = "1.3.4"
mlkitBarcodeScanning = "17.2.0"
guava = "33.2.1-android"
